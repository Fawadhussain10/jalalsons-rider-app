# Codemagic CI/CD — iOS App Store build for JS Rider
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# ── ONE-TIME SETUP IN THE CODEMAGIC UI ──
#   1. Settings ▸ Integrations ▸ App Store Connect ▸ add API key, name it
#      exactly "AppStoreConnect_JSRider" (referenced below).
#      Issuer ID 2f5f3664-6f48-4533-a61e-ee6cbdbc1233, Key ID M2T3X2NLQJ.
#   2. App ▸ Environment variables:
#        group "mapbox":        MAPBOX_DOWNLOADS_TOKEN = <Mapbox sk. token, DOWNLOADS:READ>  (secure)
#        group "mapbox_public": MAPBOX_TOKEN           = <Mapbox pk. public token>          (secure)
#   3. Bundle id com.jalalsons.jsrider is registered (Push Notifications ON) and
#      the App Store Connect app record exists (Apple ID 6805820489).

workflows:
  ios-appstore:
    name: iOS — App Store / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: AppStoreConnect_JSRider
    environment:
      groups:
        - mapbox
        - mapbox_public
      vars:
        BUNDLE_ID: "com.jalalsons.jsrider"
        APP_STORE_APPLE_ID: 6805820489
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Use CocoaPods only (skip Swift Package Manager migration)
        script: flutter config --no-enable-swift-package-manager

      - name: Configure Mapbox SDK download token (.netrc)
        script: |
          cat > $HOME/.netrc <<EOF
          machine api.mapbox.com
            login mapbox
            password $MAPBOX_DOWNLOADS_TOKEN
          EOF
          chmod 600 $HOME/.netrc

      - name: Flutter pub get
        script: flutter pub get

      - name: Fetch / create iOS signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates

      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Flutter build (no code signing)
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=MAPBOX_TOKEN=$MAPBOX_TOKEN

      - name: Sign and build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # flip once TestFlight looks good
      email:
        recipients:
          - fawadh817@gmail.com
        notify:
          success: true
          failure: true
